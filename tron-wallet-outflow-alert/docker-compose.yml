services:
  outflow-alert:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/outflow_alert.db
      HEARTBEAT_FILE: /tmp/outflow_alert.heartbeat
    volumes:
      - outflow-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  outflow-data:
