# Migrations run automatically at startup (DB_AUTO_MIGRATE=true).
# Manual use:  DATABASE_URL=postgresql+asyncpg://... alembic upgrade head
[alembic]
script_location = app/db/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
