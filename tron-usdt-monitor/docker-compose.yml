services:
  tron-usdt-monitor:
    build: .
    image: tron-usdt-monitor:latest
    container_name: tron-usdt-monitor
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/monitor.db
      HEARTBEAT_FILE: /app/data/heartbeat
    volumes:
      # Docker-managed volume: owned by the container's non-root user automatically,
      # survives restarts, rebuilds and `docker compose down` (not `down -v`).
      - monitor-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  monitor-data:
