# /etc/nginx/sites-available/tron-funding-bot
# HTTPS termination in front of the bot (which listens on 127.0.0.1:8080).
# Obtain certificates with: certbot --nginx -d funding.example.internal
# Set TRUST_PROXY=127.0.0.1 in the bot configuration.

log_format fundbot_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 443 ssl http2;
    server_name funding.example.internal;

    ssl_certificate     /etc/letsencrypt/live/funding.example.internal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/funding.example.internal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Restrict to your internal network / upstream bot hosts
    allow 10.0.0.0/8;
    allow 127.0.0.1;
    deny all;

    client_max_body_size 64k;
    # Log path only (no query strings, no bodies, no Authorization header)
    access_log /var/log/nginx/tron-funding-bot.access.log fundbot_noquery;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name funding.example.internal;
    return 301 https://$host$request_uri;
}
