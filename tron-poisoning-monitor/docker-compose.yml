# docker compose up -d
#
# Services: PostgreSQL 16 + the monitor.  Redis is not needed: the durable
# queues (alerts outbox, jobs, pending analysis) live in PostgreSQL so they
# survive restarts together with the incidents they belong to.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tron_poison}
      POSTGRES_USER: ${POSTGRES_USER:-tron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tron} -d ${POSTGRES_DB:-tron_poison}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # not exposed to the internet; only the app container talks to it

  monitor:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tron}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tron_poison}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./data:/app/data:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
